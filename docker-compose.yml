services:
  icapture-worker:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
      DATA_DIR: /data
      SQLITE_PATH: /data/tasks.db
      LOG_DIR: /data/logs
    volumes:
      - ./data:/data
    user: "1001:1001"
